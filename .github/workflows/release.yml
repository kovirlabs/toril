name: Release

# Build the Tauri app on each platform and publish the binaries to a GitHub
# Release whenever a version tag (e.g. v0.1.0-alpha) is pushed.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Toril ${{ github.ref_name }}"
          releaseBody: |
            Toril — a WYSIWYG markdown editor on Tauri + Rust. Your notes stay plain
            `.md` and `.html` files in ordinary folders.

            **What changed in this release: see [CHANGELOG.md](https://github.com/kovirlabs/toril/blob/main/CHANGELOG.md)**,
            which is the source of truth for these notes (CLAUDE.md §9/§10).

            Download the installer for your platform from the assets below. Back up
            anything important, as with any editor.

            Windows: SmartScreen will warn on first run (the build is unsigned) — that is expected.
          releaseDraft: false
          # Derived from the tag rather than hardcoded: a semver pre-release always
          # carries a hyphen (`v1.1.0-beta.1`), a final release never does. This was
          # pinned to `true` through the alpha/beta series, which would have published
          # v1.0.0 itself as a prerelease labelled "early alpha".
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
