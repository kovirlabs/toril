<!doctype html>
<!--
  UI/UX harness — app.html with a fake Tauri IPC bridge.

  Lets the real frontend (chrome, panes, tabs, editor, theming) boot in a plain
  browser so UI work can be driven and screenshotted headlessly. Every `invoke`
  is answered from in-memory fixtures; nothing touches disk, so this can never
  write a note. Not part of the build (vite's input is app.html, §4) — scratch
  tooling only.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toril — UI harness</title>
    <script>
      // ---- fake backend state -------------------------------------------------
      const FILES = {
        "/vault/Welcome.md":
          "# Welcome to Toril\n\nA WYSIWYG markdown editor.\n\n## Getting started\n\n- Type `# ` to make a heading\n- Use **bold** and *italic*\n- Tables, task lists, and footnotes all work\n\n### Task list\n\n- [x] Ship the editor\n- [ ] Make the panes feel good\n\n## Why\n\nFiles stay plain `.md` in ordinary folders.\n",
        "/vault/Projects/Toril.md":
          "# Toril\n\n## Architecture\n\nTauri 2 + TypeScript + Milkdown.\n\n### Frontend\n\nThe editor is a single Milkdown instance with per-tab buffers.\n\n### Backend\n\nAll disk I/O lives in Rust.\n\n## Open questions\n\n1. Right-rail coexistence\n2. Touch targets\n",
        "/vault/Projects/Roadmap.md": "# Roadmap\n\n## Movement I\n\nData safety floor.\n\n## Movement II\n\nNotes system.\n",
        "/vault/Notes/Daily/2026-08-12.md": "# 2026-08-12\n\n- Looked at pane UX\n- Built a harness\n",
        "/vault/Wide.md":
          "# Width stress\n\nA very long unbroken string that cannot wrap:\n\nhttps://example.com/a/very/long/path/that/keeps/going/and/going/without/any/spaces/at/all/to/break/on/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\n| Column one is wide | Column two is also wide | Column three as well | Column four here |\n|---|---|---|---|\n| some content here | more content here | further content | and yet more text |\n\n```\nconst aLongLineOfCode = somethingVeryLong(withArguments, thatKeepGoing, andGoing, andGoingFurtherStill, untilItOverflows);\n```\n",
        "/vault/Notes/Ideas.md": "# Ideas\n\n- Command palette\n- Split view\n",
        // Front-matter fixtures, one per state the properties strip can be in.
        // Typed rows: exactly what Obsidian writes.
        "/vault/Properties.md":
          "---\ntitle: Properties demo\ntags:\n  - alpha\n  - beta\nstatus: draft\ncount: 3\npublished: 2026-08-17\nsummary:\ndone: false\n---\n\n# Properties demo\n\nEvery row above is typed, and editing one leaves the others' bytes alone.\n",
        // Raw mode: a comment is something no serializer of ours can reproduce,
        // so the strip must show the block's own text and say why.
        "/vault/PropertiesRaw.md":
          "---\n# Kept by hand, do not reformat\ntitle: Raw demo\nnote: |\n  a block scalar\n  over two lines\nbase: &anchor\n  x: 1\nalias: *anchor\n---\n\n# Raw demo\n\nThe strip should show text, not rows.\n",
        // TOML and JSON: typed rows too, in their own spelling.
        "/vault/PropertiesToml.md":
          '+++\ntitle = "Hugo style"\ntags = ["alpha", "beta"]\ndraft = true\nweight = 3\n+++\n\n# TOML front matter\n\nDelimited with `+++`; edits come back as TOML, not YAML.\n',
        "/vault/PropertiesJson.md":
          '{\n  "title": "JSON front matter",\n  "tags": [\n    "alpha"\n  ],\n  "draft": false\n}\n\n# JSON front matter\n\nThe braces are the delimiters.\n',
        // A properties-only note: the body is empty, which must round-trip.
        "/vault/PropertiesOnly.md": "---\ntype: index\ntags:\n  - moc\n---\n",
        // A leading thematic break is NOT front matter — the strip must stay away.
        "/vault/NotProperties.md": "---\n\nThis note opens with a rule, not properties.\n\n---\n\nAnd has another.\n",
      };

      const TREE = [
        {
          name: "Notes", path: "/vault/Notes", is_dir: true,
          children: [
            {
              name: "Daily", path: "/vault/Notes/Daily", is_dir: true,
              children: [{ name: "2026-08-12.md", path: "/vault/Notes/Daily/2026-08-12.md", is_dir: false, children: [] }],
            },
            { name: "Ideas.md", path: "/vault/Notes/Ideas.md", is_dir: false, children: [] },
          ],
        },
        {
          name: "Projects", path: "/vault/Projects", is_dir: true,
          children: [
            { name: "Roadmap.md", path: "/vault/Projects/Roadmap.md", is_dir: false, children: [] },
            { name: "Toril.md", path: "/vault/Projects/Toril.md", is_dir: false, children: [] },
          ],
        },
        { name: "NotProperties.md", path: "/vault/NotProperties.md", is_dir: false, children: [] },
        { name: "Properties.md", path: "/vault/Properties.md", is_dir: false, children: [] },
        { name: "PropertiesJson.md", path: "/vault/PropertiesJson.md", is_dir: false, children: [] },
        { name: "PropertiesOnly.md", path: "/vault/PropertiesOnly.md", is_dir: false, children: [] },
        { name: "PropertiesRaw.md", path: "/vault/PropertiesRaw.md", is_dir: false, children: [] },
        { name: "PropertiesToml.md", path: "/vault/PropertiesToml.md", is_dir: false, children: [] },
        { name: "Welcome.md", path: "/vault/Welcome.md", is_dir: false, children: [] },
        { name: "Wide.md", path: "/vault/Wide.md", is_dir: false, children: [] },
      ];

      const SETTINGS = {
        version: 1,
        last_folder: "/vault",
        open_files: ["/vault/Welcome.md", "/vault/Projects/Toril.md"],
        active_file: "/vault/Welcome.md",
        theme: "system",
        sidebar_visible: true,
        sidebar_width: 240,
        rail_visible: true,
        rail_width: 260,
        rail_tab: "outline",
        properties_expanded: true,
        outline_visible: null,
        history_visible: null,
        autosave: false,
        autosave_debounce_ms: 2000,
      };

      const HISTORY = [
        { hash: "a1b2c3d4", saved_at: Date.now() - 60_000, bytes: 412 },
        { hash: "e5f6a7b8", saved_at: Date.now() - 3_600_000, bytes: 388 },
        { hash: "c9d0e1f2", saved_at: Date.now() - 86_400_000 * 3, bytes: 201 },
      ];

      // ---- in-memory vault mutations (ROADMAP II.12) --------------------------
      //
      // Enough of `fileops` / `trashbin` to drive the sidebar's file operations
      // here: create, rename, delete-to-trash and restore against TREE + FILES.
      // Deliberately *not* a reimplementation of the rules — the real ones are
      // unit-tested in Rust. What this stub owes the harness is the small set of
      // refusals the UI has to render (a taken name, a reserved device name), so
      // the error path can be seen without a backend.
      const TRASH = [];
      let trashSeq = 0;

      /** The children array a path belongs in, or null if the folder is unknown. */
      function listFor(dir) {
        if (dir === "/vault") return TREE;
        let found = null;
        const walk = (nodes) => {
          for (const n of nodes) {
            if (n.is_dir && n.path === dir) found = n.children;
            else if (n.is_dir) walk(n.children);
          }
        };
        walk(TREE);
        return found;
      }

      function findNode(path) {
        let hit = null;
        const walk = (nodes, parent) => {
          for (const n of nodes) {
            if (n.path === path) hit = { node: n, siblings: nodes };
            else if (n.is_dir) walk(n.children, n);
          }
        };
        walk(TREE, null);
        return hit;
      }

      // vaultscan's order: directories first, then case-insensitive by name.
      function insert(list, node) {
        list.push(node);
        list.sort((a, b) =>
          a.is_dir === b.is_dir
            ? a.name.toLowerCase().localeCompare(b.name.toLowerCase())
            : a.is_dir ? -1 : 1,
        );
      }

      const RESERVED = /^(con|prn|aux|nul|com[0-9]|lpt[0-9])(\.|$)/i;
      function checkName(name) {
        if (!name.trim()) throw new Error("Enter a name.");
        if (/[<>:"/\\|?*]/.test(name)) throw new Error(`A name cannot contain ${name.match(/[<>:"/\\|?*]/)[0]}`);
        if (/[. ]$/.test(name)) throw new Error("A name cannot end with a space or a dot.");
        if (RESERVED.test(name)) throw new Error(`"${name.split(".")[0]}" is a reserved name on Windows.`);
      }

      function withExtension(name) {
        return /\.(md|markdown|html?)$/i.test(name) ? name : `${name}.md`;
      }

      /**
       * Move a subtree's paths (and any FILES entries) from one root to another.
       * `from` stays the *original* root throughout, so a child's path — still
       * un-rewritten when it is visited — slices correctly against it.
       */
      function repath(node, from, to) {
        const oldPath = node.path;
        node.path = to + oldPath.slice(from.length);
        if (!node.is_dir && oldPath in FILES) {
          FILES[node.path] = FILES[oldPath];
          delete FILES[oldPath];
        }
        for (const child of node.children) repath(child, from, to);
      }

      // ---- fake Tauri bridge --------------------------------------------------
      const callbacks = new Map();
      let nextCallbackId = 1;

      const HANDLERS = {
        "plugin:app|version": () => "0.0.0-harness",
        "plugin:event|listen": () => 0,
        "plugin:event|unlisten": () => null,
        "plugin:dialog|open": () => null,
        "plugin:dialog|ask": () => true,
        "plugin:dialog|message": () => null,
        // The updater, faked so the notice can actually be driven here (§8).
        // `?update` in the URL makes the check report an available version, so
        // the toast's layout and target sizes can be swept without waiting for
        // a real release; without it the harness answers "up to date", which is
        // what a normal harness session should see.
        "plugin:updater|check": () =>
          new URLSearchParams(location.search).has("update")
            ? {
                available: true,
                version: "9.9.9",
                currentVersion: "0.0.0-harness",
                body: "A pretend release, for driving the update notice. " +
                  "https://example.com/an-unbroken-url-that-must-not-widen-the-toast",
                rid: 1,
              }
            : { available: false },
        "plugin:updater|download_and_install": () => null,
        "plugin:process|restart": () => null,
        "plugin:opener|open_url": () => null,
        // Rebuilds the native menu, which the harness does not have.
        set_recent_files: () => null,
        load_settings: () => SETTINGS,
        save_settings: () => null,
        load_recovery: () => [],
        save_recovery: () => null,
        clear_recovery: () => null,
        take_launch_path: () => null,
        open_folder: () => TREE,
        watch_folder: () => null,
        open_file: ({ path }) => {
          if (!(path in FILES)) throw new Error(`no such file: ${path}`);
          return { path, content: FILES[path] };
        },
        save_file: ({ path, content }) => { FILES[path] = content; return null; },
        save_file_as: () => null,
        merge_external: () => ({ outcome: "unchanged" }),
        list_history: () => HISTORY,
        read_snapshot: ({ path }) => FILES[path] ?? "",
        restore_snapshot: () => null,
        create_note: ({ dir, name }) => {
          const fileName = withExtension(name);
          checkName(fileName);
          const list = listFor(dir);
          if (!list) throw new Error("That location is outside the open folder.");
          const path = `${dir}/${fileName}`;
          if (findNode(path)) throw new Error(`"${fileName}" already exists`);
          insert(list, { name: fileName, path, is_dir: false, children: [] });
          FILES[path] = "";
          return path;
        },
        create_folder: ({ parent, name }) => {
          checkName(name);
          const list = listFor(parent);
          if (!list) throw new Error("That location is outside the open folder.");
          const path = `${parent}/${name}`;
          if (findNode(path)) throw new Error(`"${name}" already exists`);
          insert(list, { name, path, is_dir: true, children: [] });
          return path;
        },
        suggest_note_name: ({ dir, stem }) => { // vaultRoot ignored: one vault here

          for (let n = 1; n < 100; n++) {
            const candidate = n === 1 ? `${stem}.md` : `${stem} ${n}.md`;
            if (!findNode(`${dir}/${candidate}`)) return candidate;
          }
          return `${stem}.md`;
        },
        rename_entry: ({ path, newName }) => {
          checkName(newName);
          const hit = findNode(path);
          if (!hit) throw new Error("no such entry");
          const parent = path.slice(0, path.lastIndexOf("/"));
          const target = `${parent}/${newName}`;
          if (target !== path && findNode(target)) throw new Error(`"${newName}" already exists`);
          repath(hit.node, path, target);
          hit.node.name = newName;
          insert(hit.siblings, hit.siblings.splice(hit.siblings.indexOf(hit.node), 1)[0]);
          return target;
        },
        move_to_trash: ({ path }) => {
          const hit = findNode(path);
          if (!hit) throw new Error("no such entry");
          hit.siblings.splice(hit.siblings.indexOf(hit.node), 1);
          const entry = {
            id: `harness-${trashSeq++}`,
            original_path: path,
            name: hit.node.name,
            deleted_at: Date.now(),
          };
          TRASH.push({ entry, node: hit.node });
          return entry;
        },
        restore_from_trash: ({ id }) => {
          const idx = TRASH.findIndex((t) => t.entry.id === id);
          if (idx === -1) throw new Error("no such trash entry");
          const { entry, node } = TRASH[idx];
          const parent = entry.original_path.slice(0, entry.original_path.lastIndexOf("/"));
          const list = listFor(parent);
          if (!list) throw new Error("the original folder is gone");
          // The real `restore` refuses rather than clobbers; so does this, since
          // that refusal is a message the UI has to render.
          if (findNode(entry.original_path)) throw new Error("something is already there");
          insert(list, node);
          TRASH.splice(idx, 1);
          return entry.original_path;
        },
        list_trash: () => TRASH.map((t) => t.entry),
        list_api_keys: () => [
          { provider: "anthropic", configured: false },
          { provider: "openai", configured: false },
        ],
        has_api_key: () => false,
        markdown_to_html: ({ content }) => `<pre>${content.replace(/[<&]/g, (c) => (c === "<" ? "&lt;" : "&amp;"))}</pre>`,
        export_html: () => null,
        export_rtf: () => null,
        save_clipboard_image: () => "assets/pasted.png",
      };

      window.__TAURI_INTERNALS__ = {
        transformCallback(cb, once) {
          const id = nextCallbackId++;
          callbacks.set(id, { cb, once });
          return id;
        },
        convertFileSrc: (p) => p,
        // getCurrentWindow() reads this rather than going through invoke.
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        async invoke(cmd, args) {
          const handler = HANDLERS[cmd];
          if (!handler) {
            console.warn(`[harness] unstubbed command: ${cmd}`, args);
            return null;
          }
          return handler(args ?? {});
        },
      };

      // Surface anything the harness swallowed, so a stub gap is visible rather
      // than looking like a UI bug.
      window.addEventListener("error", (e) => console.error("[harness] error:", e.message));
      window.addEventListener("unhandledrejection", (e) => console.error("[harness] rejection:", e.reason));
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="workspace">
      <aside id="sidebar" aria-label="Workspace files">
        <div class="pane-scroll" id="sidebar-body"></div>
      </aside>

      <!-- Positioned against #workspace and offset by the same variables that
           size the panes, so a handle tracks its pane through drags and
           collapse animations without JS keeping them in sync. -->
      <div class="pane-resize" data-edge="left" id="resize-sidebar"></div>

      <section id="main">
        <!-- Each pane toggle sits on the side it controls: ☰ opens the files
             pane on the left, ≡ / ⟲ the rail on the right. -->
        <nav id="tabrow">
          <button
            id="btn-toggle-sidebar"
            class="pane-toggle"
            type="button"
            title="Toggle Sidebar (Ctrl+\)"
            aria-label="Toggle files pane"
          >
            ☰
          </button>

          <div id="tabbar"></div>

          <div class="rail-toggles">
            <button
              id="btn-rail-outline"
              class="pane-toggle"
              type="button"
              title="Outline (Ctrl+Shift+\)"
              aria-label="Toggle outline"
            >
              ≡
            </button>
            <button
              id="btn-rail-history"
              class="pane-toggle"
              type="button"
              title="Version History"
              aria-label="Toggle version history"
            >
              ⟲
            </button>
          </div>
        </nav>

        <div id="format-toolbar" class="format-toolbar"></div>
        <div id="searchbar"></div>
        <div id="conflictbar"></div>
        <main id="editor" class="editor"></main>
      </section>

      <div class="pane-resize" data-edge="right" id="resize-rail"></div>

      <!-- One rail, two panels. Outline and History are alternatives rather than
           two rails, so chrome stays bounded at a single rail width however many
           panels exist later (search, AI). -->
      <aside id="rail" aria-label="Panels">
        <div class="pane-scroll">
          <div class="rail-tabs" role="tablist" aria-label="Rail panels">
            <button
              class="rail-tab"
              id="rail-tab-outline"
              type="button"
              role="tab"
              data-tab="outline"
              aria-controls="outline"
              aria-selected="true"
            >
              Outline
            </button>
            <button
              class="rail-tab"
              id="rail-tab-history"
              type="button"
              role="tab"
              data-tab="history"
              aria-controls="history"
              aria-selected="false"
            >
              History
            </button>
          </div>
          <div class="rail-body">
            <div class="rail-panel" id="outline" role="tabpanel" aria-labelledby="rail-tab-outline"></div>
            <div class="rail-panel" id="history" role="tabpanel" aria-labelledby="rail-tab-history" hidden></div>
          </div>
        </div>
      </aside>
    </div>

    <footer id="statusbar">
      <span id="status"></span>
      <div class="status-right">
        <span id="docstats"></span>
        <select id="theme-select" title="Theme" aria-label="Theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </footer>
  </body>
</html>
