# Vite's esbuild needs its native binary built on install. pnpm 11+ reads
# build-script allowlists here (the package.json "pnpm" field is ignored).
allowBuilds:
  esbuild: true

# Force a patched undici (jsdom pulls it transitively as ^7.25.0). 7.28.0 fixes
# GHSA-vmh5-mc38-953g (SOCKS5 TLS cert-validation bypass) and
# GHSA-pr7r-676h-xcf6 (shared-cache whitespace bypass). Drop once jsdom's range moves.
overrides:
  undici@>=7.0.0 <7.28.0: 7.28.0
  # Milkdown pulls dompurify ^3.2.5 transitively; force the whole tree to the
  # patched 3.4.12, which fixes GHSA-c2j3-45gr-mqc4 (CUSTOM_ELEMENT_HANDLING
  # bypasses afterSanitizeElements for allowed custom elements). DOMPurify is
  # Toril's whole XSS defense (§3.3), so a sanitizer bypass matters here more
  # than its "low" rating suggests. Our direct dep is also 3.4.12.
  dompurify@<3.4.12: 3.4.12
  # postcss arrives transitively twice over — via vite, and via
  # @milkdown/components -> vue -> @vue/compiler-sfc. 8.5.18 fixes
  # GHSA-r28c-9q8g-f849 (path traversal in sourceMappingURL auto-loading leaks
  # arbitrary .map files). Drop once both parents' ranges move past it.
  postcss@<8.5.18: 8.5.18
  # One prosemirror-model for the whole tree, and a prosemirror-view that has
  # the paste-handling XSS fix (GHSA-c8x8-7fp4-3x9w, fixed in 1.42.3). Milkdown
  # 7.21.1 pins model 1.25.7; view 1.42.5+ needs model ^1.25.12, and 1.25.12
  # started validating attr types, which Milkdown fails (list `spread` is the
  # string "false" — the same upstream bug patches/ works around), breaking
  # every list round-trip. view 1.42.4 needs only ^1.25.8, so 1.25.11 is the
  # newest model that satisfies both. Letting the tree split instead (as #44
  # did) puts two models in one editor, which breaks ProseMirror's instanceof
  # checks at runtime and fails `tsc`. Drop both pins once Milkdown is fixed.
  prosemirror-model: 1.25.11
  prosemirror-view: 1.42.4

# Milkdown forwards the list `spread` attribute to mdast as the string "false",
# which is truthy, so every bullet list serializes loose. A local extendSchema
# override was rejected — it couldn't chain to the GFM-extended list_item and
# dropped task-list checkboxes. Drop this patch once Milkdown ships the fix upstream.
patchedDependencies:
  '@milkdown/preset-commonmark@7.21.1': patches/@milkdown__preset-commonmark@7.21.1.patch
