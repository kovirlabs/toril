<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toril</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="workspace">
      <aside id="sidebar" aria-label="Workspace files">
        <div class="pane-scroll" id="sidebar-body"></div>
      </aside>

      <!-- Positioned against #workspace and offset by the same variables that
           size the panes, so a handle tracks its pane through drags and
           collapse animations without JS keeping them in sync. -->
      <div class="pane-resize" data-edge="left" id="resize-sidebar"></div>

      <section id="main">
        <!-- Each pane toggle sits on the side it controls: ☰ opens the files
             pane on the left, ≡ / ⟲ the rail on the right. -->
        <nav id="tabrow">
          <button
            id="btn-toggle-sidebar"
            class="pane-toggle"
            type="button"
            title="Toggle Sidebar (Ctrl+\)"
            aria-label="Toggle files pane"
          >
            ☰
          </button>

          <div id="tabbar"></div>

          <div class="rail-toggles">
            <button
              id="btn-rail-outline"
              class="pane-toggle"
              type="button"
              title="Outline (Ctrl+Shift+\)"
              aria-label="Toggle outline"
            >
              ≡
            </button>
            <button
              id="btn-rail-history"
              class="pane-toggle"
              type="button"
              title="Version History"
              aria-label="Toggle version history"
            >
              ⟲
            </button>
            <button
              id="btn-rail-search"
              class="pane-toggle"
              type="button"
              title="Search Notes (Ctrl+Shift+F)"
              aria-label="Toggle vault search"
            >
              ⌕
            </button>
          </div>
        </nav>

        <div id="format-toolbar" class="format-toolbar"></div>
        <div id="searchbar"></div>
        <div id="conflictbar"></div>
        <!-- Front matter belongs to the top of the document, so it sits above
             the writing surface rather than in the rail. Hidden for .html tabs
             and for markdown with no block (§12b: a flex row, never animated
             around display:none). -->
        <section id="properties" aria-label="Document properties"></section>
        <main id="editor" class="editor"></main>
      </section>

      <div class="pane-resize" data-edge="right" id="resize-rail"></div>

      <!-- One rail, three panels. Outline, History and Search are alternatives
           rather than separate rails, so chrome stays bounded at a single rail
           width however many panels exist later (AI). -->
      <aside id="rail" aria-label="Panels">
        <div class="pane-scroll">
          <div class="rail-tabs" role="tablist" aria-label="Rail panels">
            <button
              class="rail-tab"
              id="rail-tab-outline"
              type="button"
              role="tab"
              data-tab="outline"
              aria-controls="outline"
              aria-selected="true"
            >
              Outline
            </button>
            <button
              class="rail-tab"
              id="rail-tab-history"
              type="button"
              role="tab"
              data-tab="history"
              aria-controls="history"
              aria-selected="false"
            >
              History
            </button>
            <button
              class="rail-tab"
              id="rail-tab-search"
              type="button"
              role="tab"
              data-tab="search"
              aria-controls="searchpanel"
              aria-selected="false"
            >
              Search
            </button>
          </div>
          <div class="rail-body">
            <div class="rail-panel" id="outline" role="tabpanel" aria-labelledby="rail-tab-outline"></div>
            <div class="rail-panel" id="history" role="tabpanel" aria-labelledby="rail-tab-history" hidden></div>
            <div class="rail-panel" id="searchpanel" role="tabpanel" aria-labelledby="rail-tab-search" hidden></div>
          </div>
        </div>
      </aside>
    </div>

    <footer id="statusbar">
      <span id="status"></span>
      <div class="status-right">
        <span id="docstats"></span>
        <select id="theme-select" title="Theme" aria-label="Theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </footer>
  </body>
</html>
